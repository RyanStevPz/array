
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de productos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main>
    <h1>Inventario de productos</h1>

    <form id="formulario">
        <label for="producto">Nombre del producto:</label>
        <input type="text" id="producto" required>

        <label for="precio">Precio unitario:</label>
        <input type="number" id="precio" min="0.01" step="0.01" required>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" min="1" step="1" required>

        <button type="button" onclick="agregarProducto()">Agregar producto</button>
    </form>

    <h3>Productos registrados</h3>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>

    <h3 id="total">Total: 0</h3>
    <a class="back-button" href="index.html">Regresar al inicio</a>

    </main>
    <script src="js/ejercicio3.js"></script>
</body>
</html>
